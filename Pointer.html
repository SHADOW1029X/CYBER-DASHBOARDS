<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Energy VFX Viewer</title>

<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#050505;
}

canvas{
    display:block;
}
</style>

<script type="importmap">
{
  "imports": {
    "three":"https://unpkg.com/three@0.179.1/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.179.1/examples/jsm/"
  }
}
</script>

</head>
<body>

<script type="module">

import * as THREE from "three";

import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

import {EffectComposer} from "three/addons/postprocessing/EffectComposer.js";
import {RenderPass} from "three/addons/postprocessing/RenderPass.js";
import {UnrealBloomPass} from "three/addons/postprocessing/UnrealBloomPass.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020202);

const camera = new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.01,
1000
);

camera.position.set(0,0,6);

const renderer = new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.8;

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff,1.2));

const key = new THREE.PointLight(0xffaa55,10);
key.position.set(3,3,4);
scene.add(key);

const fill = new THREE.PointLight(0xff3300,8);
fill.position.set(-3,-1,-2);
scene.add(fill);

const rim = new THREE.PointLight(0xffffff,4);
rim.position.set(0,5,-5);
scene.add(rim);

const composer = new EffectComposer(renderer);

composer.addPass(new RenderPass(scene,camera));

composer.addPass(

new UnrealBloomPass(new THREE.Vector2(window.innerWidth,window.innerHeight),1.3,0.35,0.08)

);

const loader = new GLTFLoader();

let mixer;

loader.load(

"./af93a7ad086d47e39cfce7796e78df43_Textured.gltf",

(gltf)=>{

console.log(gltf);

const model = gltf.scene;

scene.add(model);

// Preserve original materials
model.traverse(obj=>{

if(!obj.isMesh) return;

const m = obj.material;

if(m.emissive)
    m.emissiveIntensity = 5;

m.transparent = true;
m.blending = THREE.AdditiveBlending;
m.depthWrite = false;
if (m.color) m.color.multiplyScalar(2.2);

m.depthWrite = false;

m.needsUpdate = true;

});

// Play animations
if(gltf.animations.length){

mixer = new THREE.AnimationMixer(model);

gltf.animations.forEach(a=>{

mixer.clipAction(a).play();

});

}

// Auto frame model
const box = new THREE.Box3().setFromObject(model);

const center = box.getCenter(new THREE.Vector3());

const size = box.getSize(new THREE.Vector3());

model.position.sub(center);

const maxDim = Math.max(size.x,size.y,size.z);

const distance =
(maxDim/2)/
Math.tan(
THREE.MathUtils.degToRad(camera.fov/2)
);

camera.position.set(
0,
maxDim*0.2,
distance*1.4
);

camera.lookAt(0,0,0);

controls.target.set(0,0,0);
controls.update();

},

undefined,

console.error

);

const clock = new THREE.Clock();

function animate(){

requestAnimationFrame(animate);

if(mixer)
mixer.update(clock.getDelta());

controls.update();

composer.render();

}

animate();

window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);
composer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
